<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>サンプル動画</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .sound {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      margin: 0;
      border: 0;
      border-radius: 999px;
      padding: 0.4rem 0.75rem;
      background: rgba(0, 60, 90, 0.92);
      color: #fff;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <video autoplay playsinline loop preload="metadata" aria-label="プログラムのサンプル動画">
    <source src="sample-video.mp4" type="video/mp4" />
  </video>
  <button type="button" class="sound" aria-pressed="false">音声をオン</button>
  <script>
    const video = document.querySelector("video");
    const button = document.querySelector(".sound");

    function showSoundState(on) {
      button.textContent = on ? "音声をオフ" : "音声をオン";
      button.setAttribute("aria-pressed", on ? "true" : "false");
    }

    function playWithSound() {
      video.muted = false;
      video.volume = 1;
      return video.play().then(() => {
        showSoundState(true);
      });
    }

    button.addEventListener("click", () => {
      if (video.muted) {
        playWithSound().catch(() => {});
        return;
      }
      video.muted = true;
      showSoundState(false);
    });

    playWithSound().catch(() => {
      video.muted = true;
      showSoundState(false);
      video.play();
    });
  </script>
</body>
</html>
